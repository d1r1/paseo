# Config of the notary's secrets check. A protected path: the notary refuses a commit that
# touches it, so it is changed by hand, by the owner, on purpose.
[extend]
useDefault = true

[allowlist]
description = "public X25519 small-order points in packages/relay/src/crypto.test.ts, a test that asserts the relay rejects them"
regexTarget = "match"
regexes = [
  "e0eb7a7c3b41b8ae1656e3faf19fc46ada098deb9c32b1fd866205165f49b800",
  "5f9c95bca3508c24b1d0b1559c83ef5b04445cc4581c8e86d8224eddd09f1157",
]
